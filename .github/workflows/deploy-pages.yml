name: Publish South-View website

on:
  push:
    branches: [lauren]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: south-view-pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and prepare website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Validate content and rebuild browser data
        run: |
          node scripts/build-data.mjs
          node --check dist/app.js
          node --check dist/experience.js
          node --check dist/data.js

      - name: Upload website files
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish website
    if: github.ref == 'refs/heads/lauren'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
